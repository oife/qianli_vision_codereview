# dm_imu: 通过串口(DM_IMU)读取IMU数据
imu_source: "gimbal"
com_port: "/dev/ttyACM0"

camera_name: "hikrobot"
exposure_ms: 10
gain: 16.0
vid_pid: "2bdf:0001"
image_rotate_180: false

