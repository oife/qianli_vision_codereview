pattern_cols: 11
pattern_rows: 8
center_distance_mm: 15

R_gimbal2imubody: [1, 0, 0, 0, 1, 0,  0, 0, 1]

# IMU数据源选择: "gimbal" "can" 或 "dm_imu"
# can: 通过CAN总线(CBoard)读取IMU数据
# dm_imu: 通过串口(DM_IMU)读取IMU数据
imu_source: "gimbal"
com_port: "/dev/ttyACM0"

camera_name: "hikrobot"
exposure_ms: 3
gain: 10.0
vid_pid: "2bdf:0001"

#####-----cboard参数（仅在使用can时需要）-----#####
