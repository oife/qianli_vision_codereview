enemy_color: "red"
# enemy_color: "blue"

#####-----神经网络参数-----#####
backend: openvino
yolo_name: yolo26n
classify_model: assets/tiny_resnet.onnx
yolo26n_model_path: assets/best_fp32.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: GPU
min_confidence: 0.8
use_traditional: false

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree
min_confidence: 0.8

#####-----工业相机参数-----#####
camera_name: "hikrobot"
exposure_ms: 10 
gain: 16.0
vid_pid: "2bdf:0001"
image_rotate_180: false

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

# 固定目标几何参数（单位：m）
# 当下列 3 个值都为非 0 时：不使用 EKF 去估计/预测高/低装甲板距离与高低差，直接使用这里的固定值
# 若不存在或任意一个为 0：使用 EKF 预测
# fixed_low_armor_distance: 0.28    # 低板：装甲板中心到旋转中心距离 r_low
# fixed_high_armor_distance: 0.23   # 高板：装甲板中心到旋转中心距离 r_high
# fixed_height_diff: 0.035          # 高低差：高板相对低板的高度差 (z_high - z_low)

fixed_low_armor_distance: 0    # 低板：装甲板中心到旋转中心距离 r_low
fixed_high_armor_distance: 0   # 高板：装甲板中心到旋转中心距离 r_high
fixed_height_diff: 0          # 高低差：高板相对低板的高度差 (z_high - z_low)

#####-----aimer参数-----#####
yaw_offset: -1 # degree
pitch_offset: -1 # degree
comming_angle: 55 # degree
leaving_angle: 10 # degree
decision_speed: 7 # rad/s
high_speed_delay_time: 0.12 # s
low_speed_delay_time: 0.12 # s planner use this value（未配置左右时作为默认值）
# 识别到目标水平平移方向后，分别使用不同的延迟补偿（单位：s）
# - Left: 目标在图像中向左移动（center.x 变小）
# - Right: 目标在图像中向右移动（center.x 变大）
low_speed_delay_time_left: 0.12
low_speed_delay_time_right: 0.15

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击
default_bullet_speed: 15.5 # m/s，弹速异常(0/NaN/越界)时用于弹道解算兜底
fire_mode: single

#####-----工业相机标定参数-----#####
# 12mm
# # 重投影误差: 0.1647px
