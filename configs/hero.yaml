# t_camera2gimbal: [0.45101261225149991, 0.055058235803253593, 0.0062274533868812432]

# 8mm
# 重投影误差: 0.1581px
camera_matrix: [2394.1096763133833, 0, 708.08359669293111, 0, 2393.2977895923041, 567.38920709212687, 0, 0, 1]
distort_coeffs: [-0.034063622089730357, 0.16661704951877326, 0.0013974416165038555, -0.0006519353514003052, 0]

R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, -1]

# 相机同理想情况的偏角: yaw-0.19 pitch-10.92 roll-4.49 degree
# 标定板到世界坐标系原点的水平距离: 1.39 m
# 标定板同竖直摆放时的偏角: yaw85.57 pitch5.54 roll-4.67 degree
R_camera2gimbal: [0.018158804486670174, -0.18864134171090349, 0.9818781502901085, -0.99688233085182831, -0.078833946880268638, 0.0032904794035184103, 0.076784609493314934, -0.9788767302458411, -0.18948475064809295]
t_camera2gimbal: [0.20617037848763153, 0.0051134993534901526, 0.069915654671019942]


#####-----gimbal参数-----#####
com_port: "/dev/ttyACM0"
yaw_kp: 0
yaw_kd: 0
pitch_kp: 0
pitch_kd: 0

#####-----planner-----#####
fire_thresh: 0.0035

# 求解器类型选择: "mpc" 或 "quintic_poly"
solver_type: "mpc"

# MPC求解器参数（仅在solver_type="mpc"时使用）
max_yaw_acc: 30
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 50
Q_pitch: [9e6, 0]
R_pitch: [1]

# 五次多项式求解器参数（仅在solver_type="quintic_poly"时使用）
max_yaw_vel: 5.0      # yaw轴最大角速度（rad/s）
max_yaw_acc: 30.0      # yaw轴最大角加速度（rad/s²）
max_pitch_vel: 5.0    # pitch轴最大角速度（rad/s）
max_pitch_acc: 30.0   # pitch轴最大角加速度（rad/s²）
jump_threshold: 0.05     # 突变检测阈值（rad/s），相邻时间步角速度（斜率）变化超过此值则认为是突变
