enemy_color: "red"
# enemy_color: "blue"

#####-----神经网络参数-----#####
backend: openvino
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo26n_model_path: assets/best_fp32.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: GPU
min_confidence: 0.8
use_traditional: false

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree
min_confidence: 0.8

#####-----工业相机参数-----#####
camera_name: "hikrobot"
exposure_ms: 8
gain: 5.0
vid_pid: "2bdf:0001"
image_rotate_180: false

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
yaw_offset: 0 # degree
pitch_offset: -1 # degree
comming_angle: 55 # degree
leaving_angle: 10 # degree
decision_speed: 7 # rad/s
high_speed_delay_time: 0.0 # s
low_speed_delay_time: 0.0 # s planner use this value

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击
default_bullet_speed: 12 # m/s，弹速异常(0/NaN/越界)时用于弹道解算兜底

#####-----工业相机标定参数-----#####
# 重投影误差: 0.2654px
camera_matrix: [2433.6898865178778, 0, 735.43761200471204, 0, 2432.4680403979605, 548.93950429490985, 0, 0, 1]
distort_coeffs: [-0.025165467400342159, 0.14563413018771801, -0.0016046608513010309, 0.0021099352106817059, 0]

R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, -1]

# 相机同理想情况的偏角: yaw0.19 pitch-10.42 roll2.13 degree
# 标定板到世界坐标系原点的水平距离: 1.35 m
# 标定板同竖直摆放时的偏角: yaw-9.69 pitch4.36 roll2.07 degree
R_camera2gimbal: [-0.0099968219368503797, -0.18066940933899839, 0.98349307474951753, -0.9992790416087961, 0.037829971105087234, -0.0032078478133927973, -0.036625954630132442, -0.98281608544797738, -0.18091733369731541]
t_camera2gimbal: [0.17749392493159685, -0.017689960166199975, 0.088992358034864841]


#####-----gimbal参数-----#####
com_port: "/dev/ttyACM0"
yaw_kp: 0
yaw_kd: 0
pitch_kp: 0
pitch_kd: 0

#####-----planner-----#####
fire_thresh: 0.0035

# 求解器类型选择: "mpc" 或 "quintic_poly"
solver_type: "mpc"

# MPC求解器参数（仅在solver_type="mpc"时使用）
max_yaw_acc: 30
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 50
Q_pitch: [9e6, 0]
R_pitch: [1]

# 五次多项式求解器参数（仅在solver_type="quintic_poly"时使用）
max_yaw_vel: 5.0      # yaw轴最大角速度（rad/s）
max_yaw_acc: 30.0      # yaw轴最大角加速度（rad/s²）
max_pitch_vel: 5.0    # pitch轴最大角速度（rad/s）
max_pitch_acc: 30.0   # pitch轴最大角加速度（rad/s²）
jump_threshold: 0.05     # 突变检测阈值（rad/s），相邻时间步角速度（斜率）变化超过此值则认为是突变
