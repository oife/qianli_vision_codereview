enemy_color: "red"
# enemy_color: "blue"

#####-----神经网络参数-----#####
backend: openvino
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo26n_model_path: assets/best_fp32.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: GPU
min_confidence: 0.8
use_traditional: false

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree
min_confidence: 0.8

#####-----工业相机参数-----#####
camera_name: "hikrobot"
exposure_ms: 8
gain: 5.0
vid_pid: "2bdf:0001"
image_rotate_180: false

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

# 固定目标几何参数（单位：m）
# 当下列 3 个值都为非 0 时：不使用 EKF 去估计/预测高/低装甲板距离与高低差，直接使用这里的固定值
# 若不存在或任意一个为 0：使用 EKF 预测
fixed_low_armor_distance: 0.0 #0.28    # 低板：装甲板中心到旋转中心距离 r_low
fixed_high_armor_distance: 0.0 #0.23   # 高板：装甲板中心到旋转中心距离 r_high
fixed_height_diff: 0.0 #0.035          # 高低差：高板相对低板的高度差 (z_high - z_low)

#####-----aimer参数-----#####
yaw_offset: 0 # degree
pitch_offset: -1 # degree
comming_angle: 55 # degree
leaving_angle: 10 # degree
decision_speed: 7 # rad/s
high_speed_delay_time: 0.0 # s
low_speed_delay_time: 0.0 # s planner use this value

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击
default_bullet_speed: 12 # m/s，弹速异常(0/NaN/越界)时用于弹道解算兜底

#####-----工业相机标定参数-----#####
# 重投影误差: 0.1647px
camera_matrix: [3238.1857164791413, 0, 646.68644975997097, 0, 3237.3365481290216, 604.77800041562114, 0, 0, 1]
distort_coeffs: [-0.053731448400275161, 0.37626315976617325, 0.00092645674212235476, 0.0032863251473162166, 0]

R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, -1]

# 相机同理想情况的偏角: yaw-1.40 pitch-10.84 roll4.74 degree
# 标定板到世界坐标系原点的水平距离: 2.25 m
# 标定板同竖直摆放时的偏角: yaw115.35 pitch1.48 roll3.85 degree
R_camera2gimbal: [0.0088553681671126091, -0.18944600768994327, 0.98185120696822836, -0.99665546310057862, 0.078096889176995046, 0.024057509693390603, -0.081237124065271574, -0.97878040748230055, -0.18812082182040765]
t_camera2gimbal: [0.45101261225149991, 0.055058235803253593, 0.0062274533868812432]


#####-----gimbal参数-----#####
com_port: "/dev/ttyACM0"
yaw_kp: 0
yaw_kd: 0
pitch_kp: 0
pitch_kd: 0

#####-----planner-----#####
fire_thresh: 0.0035

# 求解器类型选择: "mpc" 或 "quintic_poly"
solver_type: "mpc"

# MPC求解器参数（仅在solver_type="mpc"时使用）
max_yaw_acc: 30
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 50
Q_pitch: [9e6, 0]
R_pitch: [1]

# 五次多项式求解器参数（仅在solver_type="quintic_poly"时使用）
max_yaw_vel: 5.0      # yaw轴最大角速度（rad/s）
max_yaw_acc: 30.0      # yaw轴最大角加速度（rad/s²）
max_pitch_vel: 5.0    # pitch轴最大角速度（rad/s）
max_pitch_acc: 30.0   # pitch轴最大角加速度（rad/s²）
jump_threshold: 0.05     # 突变检测阈值（rad/s），相邻时间步角速度（斜率）变化超过此值则认为是突变
