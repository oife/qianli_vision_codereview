enemy_color: "red"
# enemy_color: "blue"

#####-----神经网络参数-----#####
backend: tensorrt
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo26n_model_path: assets/best_fp32.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.onnx
device: GPU
min_confidence: 0.8
use_traditional: false

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree
min_confidence: 0.8

#####-----工业相机参数-----#####
camera_name: "hikrobot"
exposure_ms: 15
gain: 5.0
vid_pid: "2bdf:0001"
image_rotate_180: false

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
yaw_offset: 0 # degree
pitch_offset: 0 # degree
comming_angle: 55 # degree
leaving_angle: 20 # degree
decision_speed: 7 # rad/s
high_speed_delay_time: 0.0 # s
low_speed_delay_time: 0.0 # s planner use this value

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

#####-----工业相机标定参数-----#####
# 重投影误差: 0.1820px
camera_matrix: [1785.4881526822305, 0, 672.4806478241826, 0, 1785.026019470562, 559.89603224794314, 0, 0, 1]
distort_coeffs: [-0.076005079619881746, 0.11182817466388446, 0.0005362204787722057, -0.0027546300984895122, 0]

R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, -1]

# 相机同理想情况的偏角: yaw0.78 pitch-9.71 roll0.17 degree
# 标定板到世界坐标系原点的水平距离: 1.26 m
# 标定板同竖直摆放时的偏角: yaw-110.48 pitch20.79 roll2.59 degree
R_camera2gimbal: [-0.014136563198363188, -0.16852651271529709, 0.98559574476199896, -0.99989575749726212, 0.005278851775101687, -0.013439042484943937, -0.0029379788825492216, -0.98568298566829138, -0.16858356991156756]
t_camera2gimbal: [0.20655211194656695, 0.0083077735930537338, 0.081116422383881795]

#####-----gimbal参数-----#####
com_port: "/dev/ttyACM0"
yaw_kp: 0
yaw_kd: 0
pitch_kp: 0
pitch_kd: 0

#####-----planner-----#####
fire_thresh: 0.0035

# 求解器类型选择: "mpc" 或 "quintic_poly"
solver_type: "quintic_poly"

# MPC求解器参数（仅在solver_type="mpc"时使用）
max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e6, 0]
R_pitch: [1]

# 五次多项式求解器参数（仅在solver_type="quintic_poly"时使用）
max_yaw_vel: 5.0      # yaw轴最大角速度（rad/s）
max_yaw_acc: 5.0      # yaw轴最大角加速度（rad/s²）
max_pitch_vel: 5.0    # pitch轴最大角速度（rad/s）
max_pitch_acc: 5.0   # pitch轴最大角加速度（rad/s²）
jump_threshold: 0.05     # 突变检测阈值（rad/s），相邻时间步角速度（斜率）变化超过此值则认为是突变
